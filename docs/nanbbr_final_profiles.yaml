codex_tasks:
- Create separate tcp_nanbbr1.c, tcp_nanbbr2.c, tcp_nanbbr3.c files; do not mutate upstream bbr runtime unless intentionally
  replacing it.
- 'Register runtime names: nanbbr1, nanbbr2, nanbbr3.'
- Add Kconfig entries TCP_CONG_NANBBR1, TCP_CONG_NANBBR2, TCP_CONG_NANBBR3 and matching Makefile objects.
- For nanbbr3, start by duplicating the existing OMR/XanMod BBRv3 implementation and only change the constants above.
- For nanbbr2, first rebase/compile vanilla BBR2 on Linux/OpenWrt 6.6, then apply the constants above.
- For nanbbr1, duplicate Linux 6.6 BBRv1/Nanqinlang-style code and apply the balanced_edge constants.
- Do not disable loss, ECN, recovery, app-limited filtering, or ProbeRTT logic.
- Keep fq/fq_codel pacing available; BBR-style algorithms depend heavily on pacing.
- 'Expose only one profile in code initially: balanced_edge. Keep conservative/aggressive in comments or compile-time macros
  for test builds.'
test_gates:
  must_not_collapse:
  - iperf3 10-15 min over 4G/5G or Starlink/FWA without RTO storms
  - sustained retransmission rate should not remain above ~3-4% for long periods on balanced_edge
  - p95 RTT under load should rise, but not stay at multi-second bufferbloat levels
  - on sustained loss >=3%, nanbbr2/3 should leave UP/refill behavior and reduce inflight/rate through existing BBR2/3 logic
  - on nanbbr1 sustained loss >=~4.7%, LT policer/loss estimator should engage
  expected_behavior:
  - beats normal bbr/cubic on high-latency lossy paths
  - unfair to other flows by design
  - less queue explosion than historical Nanqinlang BBR1 because cruise/refill means are lower and loss brakes are tighter
