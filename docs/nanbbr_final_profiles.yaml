metadata:
  project: nanbbr 9 congestion-control profiles for OpenMPTCProuter Linux 6.6
  date: '2026-05-26'
  fixed_point: BBR_UNIT = 1 << 8 = 256
  runtime_names:
  - nanbbr1_light
  - nanbbr1_def
  - nanbbr1_aggr
  - nanbbr2_light
  - nanbbr2_def
  - nanbbr2_aggr
  - nanbbr3_light
  - nanbbr3_def
  - nanbbr3_aggr
  goal: Throughput-first Nan-style behavior for lossy/high-latency 4G/5G/Starlink/FWA, with guarded slowdown on queue collapse
    or severe loss.
  default_recommendation: Use *_def as the normal mobile/edge profile. Use *_light for cleaner Starlink/FWA or latency-sensitive
    cases. Use *_aggr for dirty LTE/5G where high loss is normal but delivery rate remains alive.
  important_names_length_note: All names are <= 15 chars, safe for Linux TCP_CA_NAME_MAX=16 including NUL.
common_logic_for_nanbbr2_nanbbr3:
  dynamic_loss_gate:
    rule: trigger = panic_loss || hard_loss || (soft_loss && (rtt_bad || bw_bad))
    rtt_bad: sample_rtt_us >= min_rtt_us * rtt_inflation_trigger / BBR_UNIT
    bw_bad: bw_latest <= bw_reference * bw_drop_trigger / BBR_UNIT
    note: Do not feed soft_loss into the original BBR2/3 loss gate as an unconditional threshold. Soft loss is conditional;
      hard/panic are unconditional.
  static_fallback_if_dynamic_gate_is_not_implemented:
    light: BBR_UNIT * 8 / 100  /* 20, 7.8125% */
    def: BBR_UNIT * 12 / 100 /* 30, 11.71875% */
    aggr: BBR_UNIT * 16 / 100 /* 40, 15.625% */
    note: Fallback is less smart than the dynamic gate. Prefer the dynamic gate on LTE/5G.
  ecn:
    recommendation: Keep base BBRv2/BBRv3 ECN behavior initially.
    reason: The profiles already increase loss tolerance; making ECN more permissive at the same time makes debugging impossible.
  beta_semantics_warning: 'Check the actual local BBR2/3 code: some versions store beta as cut_fraction, others use keep_factor.
    Values below are beta_cut percentages.'
