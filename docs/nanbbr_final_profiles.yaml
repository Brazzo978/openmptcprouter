metadata:
  project: nanbbr1/nanbbr2/nanbbr3 for OpenMPTCProuter kernel 6.6
  fixed_point: BBR_SCALE=8, BBR_UNIT=1<<8=256
  integer_policy: Linux-kernel style integer arithmetic/flooring, except startup high gain keeps the common +1 bias.
  design_goal: 'Throughput-dominant Nan-style behavior for 4G/5G/Starlink/FWA: squeeze lossy/high-latency links, but slow
    down on sustained congestion/loss/ECN.'
  fairness_goal: Fairness with competing CUBIC/Reno/BBR flows is deliberately low priority; self-preservation and link usability
    are high priority.
recommended_defaults:
  nanbbr3: balanced_edge
  nanbbr2: balanced_edge, slightly calmer than nanbbr3 because BBR2 porting/rebase is riskier
  nanbbr1: balanced_edge only as BBRv1/Nanqinlang-style fallback; nanbbr3 should be primary
nanbbr3:
